<script>
let controller = null;

const params = new Proxy(new URLSearchParams(window.location.search), {
    get: (searchParams, prop) => searchParams.get(prop),
});

function getOrCreateDatalist(input) {
    let datalist = document.getElementById("fungusList");
    if (!datalist) {
        datalist = document.createElement("datalist");
        datalist.id = "fungusList";
        input.parentNode.appendChild(datalist);
    }
    return datalist;
}

function updateFungusLabel(input, isDuplicate) {
    const label = document.querySelector(`label[for="${input.id}"]`) || input.closest("div")?.querySelector("label");
    if (!label) return;

    if (!label.dataset.originalText) {
        label.dataset.originalText = label.textContent.trim();
    }

    if (isDuplicate) {
        label.innerHTML = `${label.dataset.originalText} <span class="text-danger"><b>(Name already entered)</b></span>`;
    } else {
        label.textContent = label.dataset.originalText;
    }
}

document.querySelectorAll('input[list="fungusList"]').forEach(input => {
    input.addEventListener("input", async () => {
        const query = input.value;

        if (controller) controller.abort();
        controller = new AbortController();

        let url = `/json/ajax/fungi/?q=${encodeURIComponent(query)}`;
        if (params.date != null && params.site != null) {
            url += `&date=${params.date}&site=${params.site}`;
        }

        try {
            const response = await fetch(url, { signal: controller.signal });
            const data = await response.json();
            const datalist = getOrCreateDatalist(input);

            datalist.innerHTML = "";
            (data.results || []).forEach(fungus => {
                const option = document.createElement("option");
                option.value = fungus;
                datalist.appendChild(option);
            });

            const isDuplicate = String(data.dup || "false").toLowerCase() === "true";
            updateFungusLabel(input, isDuplicate);
        } catch (error) {
            if (error.name !== "AbortError") {
                console.error("Fungus autocomplete error:", error);
            }
        }
    });
});
</script>
