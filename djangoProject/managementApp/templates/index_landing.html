{% load static %}

<!DOCTYPE html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/file-upload.css' %}">

<head>
    {% block title %}
    <title>BFG Database Manager</title>
    {% endblock title %}
</head>

<body>
<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        background: #000;
    }

    .landing-page {
        min-height: 100vh;
        width: 100vw;
        margin-left: calc(50% - 50vw);
        background-image: url('/media/FRDBFG%20landing%20page.png');
        background-position: center center;
        background-repeat: no-repeat;
        background-size: cover;
        padding: 2rem 1.5rem;
        box-shadow: inset 0 0 0 1000px rgba(255, 255, 255, 0.12);
    }

    .landing-page h4 {
        background: rgba(255, 255, 255, 0.7);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: inline-block;
        width: auto;
        max-width: 100%;
    }

    .landing-page .card {
        background-color: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(2px);
    }
</style>

<div class="landing-page">
    <div class="mx-auto text-center">
        <h4>Login to access the BFG Database manager</h4>
    </div>
    <div class="mx-auto mt-3" style="width: 50px;">
        <a href="/auth/login/" class="button-class"><button class="btn btn-dark">Login</button></a>
    </div>
</div>

</body>

</html>
