{% load static %}

<!DOCTYPE html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/file-upload.css' %}">
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

<head>
    {% block title %}
    <title>FRDBFG</title>
    {% endblock title %}
</head>

<body>
<style>
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        background: #000;
    }

    .landing-page {
        min-height: 100vh;
        width: 100vw;
        margin-left: calc(50% - 50vw);
        background-image: url('/media/FRDBFG%20landing%20page.png');
        background-position: center center;
        background-repeat: no-repeat;
        background-size: cover;
        padding: 2rem 1.5rem;
        box-shadow: inset 0 0 0 1000px rgba(0, 0, 0, 0.1);
    }

    .landing-page h1 {
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        color: rgba(254, 206, 47, 1);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: inline-block;
        width: auto;
        max-width: 100%;
        font-size: 128px;
    }

    .landing-page h2 {
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        color: rgba(255, 255, 255, 1);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        display: inline-block;
        width: auto;
        max-width: 100%;
        font-size: 37.3px;
    }

    .landing-page h3 {
        font-family: "Calibri";
        color: rgba(254, 206, 47, 1);
        border-radius: 10px;
        padding: 0.75rem 1rem;
        margin-right: 80px;
        display: inline-block;
        width: auto;
        max-width: 100%;
        font-size: 24px;
    }

    .landing-actions img {
        display: block;
        width: 250px;
        max-width: 100%;
        height: auto;
        transition: filter 150ms ease-in-out;
    }

    .landing-actions a:hover img {
        filter: brightness(0.85);
    }

    .landing-actions {
        position: fixed;
        right: 6rem;
        bottom: 3rem;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;
        max-width: calc(100vw - 2rem);
    }

    .landing-actions h3 {
        margin: 0;
        text-align: right;
    }
</style>

<div class="landing-page">
    <div class="container">
    <div class="row align-items-center">
        <div class="col-auto">
            <img src="/media/BFGlogo.jpg" alt="BFG Logo" style="height: 96px; width: auto;">
        </div>
        <h1 class="col-auto me-auto"><b>FRDBFG</b></h1>
    </div>
    <div class="row">
        <h2><b>Fungal Records Database for Buckinghamshire Fungus Group</b></h2>
    </div>
    </div>
    <div class="landing-actions">
        <a href="/auth/login/" class="button-class">
            <img src="/media/login-button-image.png" alt="Login">
        </a>
        <h3><b><i>&#169; Bucks Fungus Group 2026 | FRDBFG website created and maintained by Jonathan Peace</i></b></h3>
    </div>
</div>

</body>

</html>
